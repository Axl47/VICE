[PersonalLSDPreview]
# Allow the manual F8 preview. Effects never start automatically.
Enabled = true
# Show faded hallucinations built from the game's character meshes.
WorldVisuals = true
# Overall artistic effect strength from 0 to 1.
Intensity = 0.6000000238418579
# Breathing, flowing ripples, color separation and afterimages from 0 to 1; 0 disables them.
MotionStrength = 0.5
# Compressed preview length in seconds, from 20 to 600.
DurationSeconds = 180.0
# Completed-frame flow and breathing from 0 to 1; default 0.30, default pixel bound 5.4, absolute bound 18. Also follows MotionStrength.
RippleStrength = 0.30000001192092896
# Brief delayed image trails from 0 to 1; also follows MotionStrength.
AfterimageStrength = 0.625
# Defined cartoon-like edges and sharpening from 0 to 1.
OutlineStrength = 0.699999988079071
# Soft/indistinct HUD and dialogue text from 0 to 1; also colors phone text fringes when PhoneEffects is enabled.
TextBlurStrength = 0.375
# NPC ID or full name used for hallucination meshes. Empty selects a nearby loaded character.
GhostModelNPC = ""
# Internal marker for one-time preview default upgrades.
DefaultsRevision = 4
# Color rings and polygon patterns within nearby opaque world textures, from 0 to 1. MotionStrength controls their animation speed.
SurfacePatternStrength = 0.44999998807907104
# Continuous slow RGB color breathing across the scene and phone, from 0 to 1. No material discovery or texture copies.
MaterialColorStrength = 0.44999998807907104
# Opacity of faded character hallucinations, from 0 to 1; 0 hides them.
HallucinationStrength = 0.550000011920929
# Direct 220ms echo on original native music, ambience and effects buses, from 0 to 1. Zero restores the original routing.
AudioStrength = 0.3499999940395355
# Gentle color breathing and soft colored text fringes on the open phone.
PhoneEffects = true
# Reserved for the disabled peripheral experiment. The default completed-frame path has no gaze mask.
CenterClarityDegrees = 5.0
